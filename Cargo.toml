[package]
name = "helibot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "0.7", features = [ "runtime-tokio", "mysql", "time" ] }

dotenvy = "0.15"
serde = "1.0"
serde_derive = "1.0"

config = "0.14"
thiserror = "1.0"
serenity = "0.12"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
